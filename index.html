<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="Discipulos - cuidado semanal e atividades do Grupo de Crescimento." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Discípulos" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Discípulos</title>
  </head>
  <body>
    <script>
      // Roda antes do React: le a escolha guardada e aplica a classe do tema
      // ainda no primeiro paint, evitando o flash de tela clara.
      ;(function () {
        try {
          var escolha = localStorage.getItem('cuidar-gc-tema') || 'system'
          var escuro =
            escolha === 'dark' ||
            (escolha === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', escuro)
          if (escuro) {
            document
              .querySelector('meta[name="theme-color"]')
              .setAttribute('content', '#1c1c1c')
          }

          // Instalado na tela de inicio, o zoom de pinca fica travado: e o que
          // faz parecer aplicativo, e nao pagina. Na aba do navegador ele
          // continua liberado - quem precisa aumentar para ler nao perde isso.
          // A ampliacao do proprio sistema (iOS/Android) funciona nos dois.
          var instalado =
            window.matchMedia('(display-mode: standalone)').matches ||
            window.navigator.standalone === true
          if (instalado) {
            document
              .querySelector('meta[name="viewport"]')
              .setAttribute(
                'content',
                'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover',
              )

            // O Safari ignora `user-scalable=no` em varias situacoes - entre
            // elas dentro de dialogos. Estes eventos de gesto sao a unica
            // forma de barrar a pinca de verdade no iPhone. Continua valendo
            // so no app instalado: na aba do navegador o zoom fica livre.
            ;['gesturestart', 'gesturechange', 'gestureend'].forEach(function (evento) {
              document.addEventListener(evento, function (e) { e.preventDefault() }, {
                passive: false,
              })
            })
          }
        } catch (e) {
          // Sem armazenamento: fica no tema claro.
        }
      })()
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
